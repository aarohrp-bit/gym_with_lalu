<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#020617" />
        <meta name="description" content="Gym with Lalu — personal 6-day workout tracker." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Gym with Lalu" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/svg+xml" href="/dumbbell.svg" />
        <link rel="apple-touch-icon" href="/dumbbell.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <title>Gym with Lalu</title>
    </head>
    <body style="background:#020617;">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
          if ("serviceWorker" in navigator) {
            var host = location.hostname;
            var isLocalDev = host === "localhost" || host === "127.0.0.1";
            if (isLocalDev) {
              // In development, never let a service worker cache-trap stale code.
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) { r.unregister(); });
              });
              if (window.caches && caches.keys) {
                caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
              }
            } else {
              window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js").then(function (reg) {
                  // Reload once when a new version takes control, so users get fresh code.
                  var refreshing = false;
                  navigator.serviceWorker.addEventListener("controllerchange", function () {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                  });
                }).catch(function (err) {
                  console.warn("SW registration failed:", err);
                });
              });
            }
          }
        </script>
    </body>
</html>
