<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gym with Lalu</title>
    <meta name="description" content="Personal 6-day gym workout tracker" />
    <meta name="theme-color" content="#020617" />
    <!-- Expose the PWA manifest/icons from any deep route so crawlers (e.g. PWABuilder)
         discover them even when GitHub Pages serves this SPA fallback page. -->
    <link rel="manifest" href="/gym_with_lalu/manifest.json" />
    <link rel="icon" type="image/png" href="/gym_with_lalu/icon-192.png" />
    <link rel="apple-touch-icon" href="/gym_with_lalu/icon-192.png" />
    <script>
      // Single-Page-App redirect for GitHub Pages (rafgraph/spa-github-pages,
      // sessionStorage variant). Save the requested deep-link, then bounce to the
      // app root so React Router can take over and restore it (see index.html).
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/gym_with_lalu/'" />
  </head>
  <body></body>
</html>
